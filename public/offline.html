<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitWrap - Offline</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
            border: 1px solid #374151;
            border-radius: 0.75rem;
            background-color: rgba(31, 41, 55, 0.3);
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 2.25rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.125rem;
            color: #9ca3af;
        }
        svg {
            width: 5rem;
            height: 5rem;
            margin-bottom: 1.5rem;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
            <path d="m9.09 9.09.41 5.83 5.41-1.41"></path>
            <path d="m14.91 14.91-.41-5.83-5.41 1.41"></path>
        </svg>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your connection. Please check your network and try again. Some previously visited pages might still be available.</p>
    </div>
</body>
</html>
